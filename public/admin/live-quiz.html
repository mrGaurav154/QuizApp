<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Leaderboard - QuizCraft</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Socket.io Client -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- Confetti JS for fun -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ["Inter", "sans-serif"] },
                    colors: {
                        brand: { 400: "#818cf8", 500: "#6366f1", 600: "#4f46e5" }
                    }
                }
            }
        };
    </script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen flex flex-col items-center py-12 px-4 selection:bg-brand-500/30">

    <div class="fixed top-6 left-6 z-50">
        <a href="/dashboard.html" class="flex items-center gap-2 px-4 py-2 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 rounded-full transition-colors text-sm font-medium">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            Back to Dashboard
        </a>
    </div>

    <div class="w-full max-w-4xl text-center mb-12 relative">
        <div class="absolute inset-0 -z-10 bg-brand-500/20 blur-[100px] rounded-full"></div>
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-red-500/10 border border-red-500/20 text-red-400 font-semibold mb-6 animate-pulse">
            <span class="w-2 h-2 rounded-full bg-red-500"></span>
            LIVE BROADCAST
        </div>
        <h1 id="quizTitle" class="text-4xl md:text-5xl font-extrabold mb-4 tracking-tight">Loading Quiz...</h1>
        <p class="text-zinc-400 text-lg">Waiting for students to submit their answers in real-time.</p>
    </div>

    <div class="w-full max-w-4xl">
        <div class="bg-zinc-900/50 backdrop-blur-xl border border-zinc-800 rounded-3xl p-6 shadow-2xl">
            <!-- Table Header -->
            <div class="grid grid-cols-12 gap-4 pb-4 border-b border-zinc-800 text-sm font-semibold text-zinc-400 uppercase tracking-wider px-4">
                <div class="col-span-1 text-center">Rank</div>
                <div class="col-span-5">Student Name</div>
                <div class="col-span-3 text-center">Score</div>
                <div class="col-span-3 text-right">Time Taken</div>
            </div>

            <!-- Leaderboard List -->
            <div id="leaderboardList" class="min-h-[300px] flex flex-col gap-3 pt-4">
                <div id="emptyState" class="flex flex-col items-center justify-center h-48 text-zinc-500">
                    <i data-lucide="users" class="w-12 h-12 mb-3 opacity-20"></i>
                    <p>No submissions yet. The leaderboard will update automatically.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Initialization Script -->
    <script>
        lucide.createIcons();
        const urlParams = new URLSearchParams(window.location.search);
        const quizId = urlParams.get('id');

        if (!quizId) {
            alert("No Quiz ID provided");
            window.location.href = "/dashboard.html";
        }

        // Fetch Quiz details
        async function fetchQuizDetails() {
            try {
                // Assuming we can fetch the quiz details from the public endpoint for the title
                const response = await fetch(`/api/quizzes/${quizId}`);
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('quizTitle').textContent = data.quiz.title;
                }
            } catch (error) {
                console.error("Failed to load quiz details:", error);
            }
        }
        
        fetchQuizDetails();

        // ---------------------------------------------------------
        // REAL-TIME WEBSOCKET LOGIC (THE GAMIFICATION PART)
        // ---------------------------------------------------------
        
        const socket = io(); // Connect to the same origin server
        
        // Array to store results so we can sort them dynamically
        let liveResults = [];

        // Join this specific quiz's room
        socket.on('connect', () => {
            console.log("Connected to Live Leaderboard Server");
            socket.emit('join_quiz_room', quizId);
        });

        // Listen for students finishing
        socket.on('student_finished', (data) => {
            console.log("New submission received!", data);
            
            // Add to array
            liveResults.push(data);
            
            // Sort array by Score (descending), then by Time Taken (ascending)
            liveResults.sort((a, b) => {
                if (b.percentage !== a.percentage) {
                    return b.percentage - a.percentage; // Highest score first
                }
                return a.timeTaken - b.timeTaken; // Lowest time breaks ties
            });

            renderLeaderboard();
            
            // Fun confetti effect for top scorer changes or new submissions
            if (liveResults[0].studentName === data.studentName) {
                fireConfetti();
            }
        });

        function renderLeaderboard() {
            const list = document.getElementById('leaderboardList');
            const emptyState = document.getElementById('emptyState');
            
            if (liveResults.length > 0 && emptyState) {
                emptyState.remove();
            }

            list.innerHTML = '';

            liveResults.forEach((result, index) => {
                const rank = index + 1;
                let rankVisual = '';
                let bgClass = 'bg-zinc-800/40 hover:bg-zinc-800 hover:-translate-y-1';
                
                // Styling for Top 3
                if (rank === 1) {
                    rankVisual = '<div class="w-8 h-8 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center font-bold text-lg ring-1 ring-amber-500/50 shadow-[0_0_15px_rgba(245,158,11,0.3)]">1</div>';
                    bgClass = 'bg-gradient-to-r from-amber-500/10 to-zinc-900 border border-amber-500/30 transform scale-[1.02] shadow-lg';
                } else if (rank === 2) {
                    rankVisual = '<div class="w-8 h-8 rounded-full bg-slate-300/20 text-slate-300 flex items-center justify-center font-bold text-lg ring-1 ring-slate-300/50">2</div>';
                    bgClass = 'bg-gradient-to-r from-slate-400/10 to-zinc-900 border border-slate-400/20';
                } else if (rank === 3) {
                    rankVisual = '<div class="w-8 h-8 rounded-full bg-orange-700/20 text-orange-400 flex items-center justify-center font-bold text-lg ring-1 ring-orange-700/50">3</div>';
                    bgClass = 'bg-gradient-to-r from-orange-700/10 to-zinc-900 border border-orange-700/20';
                } else {
                    rankVisual = `<span class="text-zinc-500 font-medium text-lg">#${rank}</span>`;
                }

                // Format Time Taken (e.g. 1m 45s)
                const mins = Math.floor(result.timeTaken / 60);
                const secs = result.timeTaken % 60;
                const timeString = mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;

                // Calculate color for score
                let scoreColor = "text-green-400";
                if (result.percentage < 50) scoreColor = "text-red-400";
                else if (result.percentage < 70) scoreColor = "text-amber-400";

                const row = document.createElement('div');
                row.className = `grid grid-cols-12 items-center gap-4 p-4 rounded-2xl transition-all duration-500 ease-out animate-[slideIn_0.5s_ease-out] ${bgClass}`;
                
                row.innerHTML = `
                    <div class="col-span-1 flex justify-center">${rankVisual}</div>
                    <div class="col-span-5 flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-brand-500/20 flex items-center justify-center text-brand-400 font-bold">
                            ${result.studentName[0].toUpperCase()}
                        </div>
                        <span class="font-semibold text-white truncate text-lg">${result.studentName}</span>
                    </div>
                    <div class="col-span-3 text-center">
                        <span class="font-bold text-2xl ${scoreColor}">${result.percentage}%</span>
                        <div class="text-xs text-zinc-500">${result.score} pts</div>
                    </div>
                    <div class="col-span-3 text-right">
                        <div class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-zinc-950/50 text-zinc-300 font-mono text-sm border border-zinc-800">
                            <i data-lucide="timer" class="w-3.5 h-3.5 text-brand-400"></i>
                            ${timeString}
                        </div>
                    </div>
                `;
                
                list.appendChild(row);
            });
            
            lucide.createIcons();
        }

        function fireConfetti() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);
                var particleCount = 50 * (timeLeft / duration);
                
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: Math.random(), y: Math.random() - 0.2 } }));
            }, 250);
        }

        // Simple animation logic for rows
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes slideIn {
                from { opacity: 0; transform: translateY(20px) scale(0.95); }
                to { opacity: 1; transform: translateY(0) scale(1); }
            }
        `;
        document.head.appendChild(style);

    </script>
</body>
</html>
